name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-14
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            # Support kernels with a 39-bit virtual address space as well.
            features: tsrs_core/plain-ptrs
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            rustflags: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - name: Preserve fixture and patch bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --target ${{ matrix.target }}
      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned compiler
        run: npm run setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}-${{ hashFiles('upstream.json', 'patches/**') }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild@0.24.0
          fallback: none
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        if: runner.os == 'Linux'
        with:
          version: 0.13.0
      - name: Build native executable
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features || '' }}
        run: |
          command=build
          [ "$RUNNER_OS" != Linux ] || command=zigbuild
          options=()
          [ -z "$FEATURES" ] || options+=(--features "$FEATURES")
          node scripts/cargo.mjs "$command" --release --locked --target "$TARGET" "${options[@]}"
      - name: Check configuration parity
        env:
          TARGET: ${{ matrix.target }}
        run: |
          extension=
          [ "$RUNNER_OS" != Windows ] || extension=.exe
          npm run verify:config -- --binary "target/$TARGET/release/effect-tsrs$extension"
      - name: Check all 130 rules against the native oracle
        if: matrix.platform == 'darwin-arm64'
        run: |
          npm run fixtures:install
          npm run verify:all -- --binary target/aarch64-apple-darwin/release/effect-tsrs --output artifacts/all-rules/release --jobs 4
      - name: Pack npm tarballs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          extension=
          [ "$RUNNER_OS" != Windows ] || extension=.exe
          npm run package:release -- --target "$TARGET" --binary "target/$TARGET/release/effect-tsrs$extension"
      - name: Verify installed packages
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(node -p 'require("./package.json").version')
          npm run verify:package -- \
            --package "artifacts/npm/yielded-effect-tsrs-$version.tgz" \
            --platform "artifacts/npm/yielded-effect-tsrs-$PLATFORM-$version.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.platform }}
          path: |
            artifacts/npm/*.tgz
            artifacts/npm/package-*.json
            artifacts/verify-package/
            artifacts/verify-config/report.json
            artifacts/verify-config/cases/*/results/**
            artifacts/all-rules/release/report.json
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: npm-*
          path: artifacts/release
      - name: Publish verified native packages, then the launcher
        run: node scripts/publish-npm.mjs --artifacts artifacts/release
